name: Release

# Push a tag like v2.1.0 (matching `version` in rust/Cargo.toml) to build and publish a
# release. The dashboard's update checker reads the latest release from this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match rust/Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  packages:
    name: Packages
    needs: version
    uses: ./.github/workflows/packages.yml

  publish:
    name: Publish release
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: AstralGuard ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
