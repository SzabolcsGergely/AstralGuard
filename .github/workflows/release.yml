name: Release

# Push a tag like v2.1.0 (matching `version` in rust/Cargo.toml) to build and publish a
# release. The dashboard's update checker reads the latest release from this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          crate=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match rust/Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "AstralGuard-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item rust\target\release\astralguard.exe, install.bat, install.ps1, uninstall.bat, uninstall.ps1, README.md, LICENSE $name
          Compress-Archive -Path "$name\*" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AstralGuard-*-windows-x64.zip

  linux:
    name: Linux package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libgtk-3-dev \
            libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        working-directory: rust
        run: cargo test
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Package
        run: |
          name="AstralGuard-${{ needs.version.outputs.version }}-linux-x64"
          mkdir "$name"
          cp rust/target/release/astralguard rust/packaging/linux/* README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: AstralGuard-*-linux-x64.tar.gz

  publish:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum AstralGuard-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: AstralGuard ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            AstralGuard-*
            SHA256SUMS.txt
