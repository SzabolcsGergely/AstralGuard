name: Packages

# Builds the installable packages: the Windows setup .exe, the Debian/Ubuntu .deb and the
# Arch Linux .pkg.tar.zst. Called by CI (every push: the packages are kept as run
# artifacts) and by Release (a v* tag: they are published).
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with ci.yml.
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  windows:
    name: Windows setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --locked --release
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path rust\Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc /Qp "/DAppVersion=$version" "/DRepoRoot=$PWD" "/DSourceExe=$PWD\rust\target\release\astralguard.exe" "/O$PWD\dist" rust\packaging\windows\astralguard.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: dist/*.exe
          if-no-files-found: error

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    # Built on Debian 12 (glibc 2.36), so the package installs on Debian 12+ and
    # Ubuntu 22.04+; a binary built on the newest runner would need the newest glibc.
    container: debian:bookworm
    steps:
      - name: Build tools and libraries
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends ca-certificates curl git build-essential \
            dpkg-dev pkg-config libssl-dev \
            libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: bookworm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        working-directory: rust
        run: |
          mkdir -p ../dist
          cargo deb --locked --output ../dist/
      - name: Inspect
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: package-deb
          path: dist/*.deb
          if-no-files-found: error

  deb-test:
    name: Install .deb on ${{ matrix.image }}
    needs: deb
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: package-deb
          path: dist
      - name: Install, check, remove
        run: |
          # Without starting the service: there is no Astral card on a CI runner.
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod +x /usr/sbin/policy-rc.d
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y ./dist/*.deb
          getent group astralguard
          test -x /usr/bin/astralguard
          test -f /lib/systemd/system/astralguard.service || test -f /usr/lib/systemd/system/astralguard.service
          # Every shared library resolves (the binary needs no display to start up to here).
          if ldd /usr/bin/astralguard | grep 'not found'; then exit 1; fi
          # And every library it loads at runtime (the window's), which ldd cannot see.
          sh .github/scripts/runtime-libs.sh
          astralguard status || true
          apt-get remove -y astralguard

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Build tools and libraries
        run: pacman -Syu --noconfirm --needed git rust openssl pkgconf libxkbcommon wayland libglvnd
      - uses: actions/checkout@v7
      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n1)
          build=/tmp/pkg
          mkdir -p "$build" dist
          cp rust/packaging/linux/arch/* "$build/"
          sed -i "s/^pkgver=.*/pkgver=$version/" "$build/PKGBUILD"
          # The checked-out tree stands in for the tag's source tarball.
          git archive --format=tar.gz --prefix="AstralGuard-$version/" -o "$build/AstralGuard-$version.tar.gz" HEAD
          useradd -m builder
          chown -R builder "$build"
          su builder -c "cd $build && makepkg --noconfirm --nodeps"
          cp "$build"/*.pkg.tar.zst dist/
      - name: Install test
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          pacman -Qi astralguard
          pacman -Ql astralguard
      - uses: actions/upload-artifact@v7
        with:
          name: package-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  # In a clean image, not the build one: that one already has the window's libraries, so a
  # dependency the PKGBUILD forgot would go unnoticed there.
  arch-test:
    name: Install Arch package on archlinux:base
    needs: arch
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: package-arch
          path: dist
      - name: Install, check, remove
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm dist/*.pkg.tar.zst
          getent group astralguard
          test -x /usr/bin/astralguard
          test -f /usr/lib/systemd/system/astralguard.service
          if ldd /usr/bin/astralguard | grep 'not found'; then exit 1; fi
          sh .github/scripts/runtime-libs.sh
          astralguard status || true
          pacman -R --noconfirm astralguard
