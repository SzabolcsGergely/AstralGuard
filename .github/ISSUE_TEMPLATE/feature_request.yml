name: Feature request
description: An idea for AstralGuard.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AstralGuard supports ASUS ROG Astral cards only, on purpose: no other card has per-pin
        sensing. Requests for other cards or other sensor sources can't be taken up.
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
