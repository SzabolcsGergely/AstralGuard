# cargo deny: known vulnerabilities, licences and where crates come from. CI runs it on
# every push, and weekly (new advisories appear without any change here).
[graph]
# What ships; macOS / Android / wasm-only crates in the lock file are not built.
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained notices fail only for crates we depend on directly; deep in the GUI stack
# they are noise until there is something to move to.
unmaintained = "workspace"
ignore = []

[licenses]
# Every licence in the dependency tree today; a new one is a decision, not an accident.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
# The GUI stack carries several versions of some crates; not worth failing on.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
