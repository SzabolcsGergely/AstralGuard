[package]
name = "astralguard"
version = "2.0.0"
edition = "2021"
# The oldest Rust that builds it: CI checks this version (the msrv job). Raise it on purpose.
rust-version = "1.95"
description = "Per-pin 12V-2x6 current guard for ASUS ROG Astral GPUs"
license = "MIT"
publish = false
repository = "https://github.com/SzabolcsGergely/AstralGuard"

[features]
default = ["ui"]
# The tray and dashboard. Off builds a headless service only (e.g. a Linux server).
ui = ["dep:eframe", "dep:tray-icon", "dep:notify-rust", "dep:png", "dep:raw-window-handle", "dep:ksni", "dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
chrono = "0.4"
interprocess = "2.2"
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow"] }
# the dashboard's PNG screenshots (--screenshot) and the window handle for the tray
png = { version = "0.18", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# the dashboard's update check (GitHub releases API). The OS TLS stack and the OS's root
# certificates: SChannel on Windows, OpenSSL on Linux; no bundled crypto or root store
# (ureq's "native-tls" feature would add Mozilla's roots, webpki-root-certs).
ureq = { version = "3.5", optional = true, default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
# The tray on Windows. Linux uses ksni instead (see ui/tray.rs).
tray-icon = { version = "0.26", optional = true }
# Not tauri-winrt-notification: linking it made every binary crash at startup on the
# GNU toolchain. Toasts go through the windows crate's WinRT bindings instead.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_EventLog",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# UI on Linux: the service there cannot reach the desktop, so the UI shows its notices
# (on Windows notify-rust would pull in tauri-winrt-notification, which crashes the GNU
# build; the service raises toasts itself there). eframe needs X11/Wayland.
[target.'cfg(not(windows))'.dependencies]
notify-rust = { version = "4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The tray on Linux: StatusNotifierItem over D-Bus directly. tray-icon goes through
# libayatana-appindicator, which has no left-click event (any click opens the menu);
# SNI has Activate (left click) and ContextMenu (right click).
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# `cargo deb` (cargo-deb) builds the Debian/Ubuntu package; the release workflow runs it.
[package.metadata.deb]
maintainer = "Szabolcs Gergely <szabi@noreply.com>"
copyright = "2026, Szabolcs Gergely"
license-file = ["../LICENSE", "0"]
extended-description = """\
Watches the per-pin current of the 12V-2x6 connector on ASUS ROG Astral graphics cards \
and steps in before a melting connector does: it lowers the GPU clocks and power limit, \
and shuts the machine down as a last resort. Runs as a root systemd service with a tray \
icon and dashboard for the desktop user."""
section = "admin"
priority = "optional"
# The window's libraries are loaded at runtime (winit, glutin), so dpkg-shlibdeps cannot see them:
# Wayland (libwayland-*, libxkbcommon0, EGL) and an X11 session (the libx* ones, libxkbcommon-x11-0).
depends = "$auto, libxkbcommon0, libwayland-client0, libwayland-egl1, libwayland-cursor0, libegl1, libgl1, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6, libxrender1, libxkbcommon-x11-0"
recommends = "kmod"
# The astralguard group is created in postinst (works on releases without systemd-sysusers).
maintainer-scripts = "packaging/linux/debian/"
systemd-units = { unit-name = "astralguard", unit-scripts = "packaging/linux/", enable = true, start = true }
assets = [
    ["target/release/astralguard", "usr/bin/", "755"],
    ["packaging/linux/modules-load.conf", "usr/lib/modules-load.d/astralguard.conf", "644"],
    ["packaging/linux/astralguard-ui.desktop", "etc/xdg/autostart/astralguard-ui.desktop", "644"],
    ["packaging/linux/astralguard.desktop", "usr/share/applications/astralguard.desktop", "644"],
    ["assets/icon/astralguard.svg", "usr/share/icons/hicolor/scalable/apps/astralguard.svg", "644"],
    ["assets/icon/astralguard-256.png", "usr/share/icons/hicolor/256x256/apps/astralguard.png", "644"],
    ["../README.md", "usr/share/doc/astralguard/README.md", "644"],
]
